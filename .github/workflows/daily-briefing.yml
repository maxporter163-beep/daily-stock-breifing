
# Build check only. The daily briefing itself runs as a Claude Code cloud
# scheduled task (see README.md), so this workflow needs no secrets.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: bash scripts/cloud-setup.sh

      - name: Compile C application
        run: make

      - name: Offline smoke test
        run: make test

      - name: Live data run (informational)
        continue-on-error: true
        run: |
          mkdir -p output
          ./stock-briefing --output output/research-input.md > /dev/null
          head -12 output/research-input.md
